<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Shipments</title>
<style>

  :root {
    --bg: #0c0e12;
    --panel: #141821;
    --panel-2: #1a2030;
    --border: #2a3348;
    --text: #eef2fa;
    --muted: #8b97b0;
    --label: #6d7a94;
    --accent: #7aa2ff;
    --ordered: #9aa3b5;
    --shipped: #5b9fd4;
    --ofd: #e0a54b;
    --desk: #5ecf8a;
    --picked: #6b7280;
    --eta: #f0c674;
    --shadow: 0 12px 36px rgba(0,0,0,.4);
    --radius: 16px;
    --font: "SF Pro Text", "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.45;
    color: var(--text);
    min-height: 100vh;
    background:
      radial-gradient(1100px 520px at 8% -12%, #1a2744 0%, transparent 55%),
      radial-gradient(900px 480px at 92% 0%, #163028 0%, transparent 50%),
      var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  header.app-header {
    padding: 28px 28px 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 16px 28px;
    align-items: flex-end;
    justify-content: space-between;
  }
  .brand h1 {
    margin: 0;
    font-size: 1.55rem;
    font-weight: 650;
    letter-spacing: -0.03em;
    line-height: 1.15;
  }
  .brand .sub {
    margin-top: 6px;
    color: var(--muted);
    font-size: 0.9rem;
    font-weight: 450;
  }
  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  input[type="search"], select {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 11px;
    padding: 10px 13px;
    min-width: 190px;
    outline: none;
    font: inherit;
  }
  input[type="search"]:focus, select:focus { border-color: var(--accent); }
  .stat { color: var(--muted); font-size: 0.85rem; padding: 4px 2px; }
  .live {
    font-size: 0.75rem;
    letter-spacing: 0.02em;
    color: #9ad7b3;
    border: 1px solid #2f6b4a;
    border-radius: 999px;
    padding: 5px 11px;
  }
  .live.stale { color: var(--muted); border-color: var(--border); }
  .board {
    display: grid;
    grid-template-columns: repeat(5, minmax(260px, 1fr));
    gap: 14px;
    padding: 14px 22px 40px;
    overflow-x: auto;
    align-items: start;
  }
  .col {
    background: color-mix(in srgb, var(--panel) 94%, transparent);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    min-height: 300px;
    box-shadow: var(--shadow);
  }
  .col-head {
    padding: 14px 14px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .col-title {
    display: flex;
    gap: 9px;
    align-items: center;
    font-weight: 600;
    font-size: 0.88rem;
    letter-spacing: 0.01em;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .count {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 999px;
    padding: 2px 9px;
    font-size: 0.75rem;
    font-variant-numeric: tabular-nums;
  }
  .cards { padding: 10px; display: flex; flex-direction: column; gap: 11px; }
  .card {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 14px 14px 12px;
    transition: border-color .15s, transform .15s;
  }
  .card:hover {
    border-color: color-mix(in srgb, var(--accent) 50%, var(--border));
    transform: translateY(-1px);
  }
  .merchant {
    font-weight: 650;
    font-size: 1.02rem;
    letter-spacing: -0.02em;
    line-height: 1.25;
    margin: 0 0 2px;
  }
  .order {
    color: var(--label);
    font-size: 0.72rem;
    font-family: var(--mono);
    letter-spacing: 0.01em;
    margin-bottom: 10px;
  }
  .items {
    margin: 0 0 12px;
    padding: 0;
    list-style: none;
    color: #d7deed;
    font-size: 0.86rem;
    line-height: 1.4;
  }
  .items li {
    position: relative;
    padding-left: 12px;
    margin-bottom: 4px;
  }
  .items li::before {
    content: "";
    position: absolute;
    left: 0; top: 0.55em;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: #4a5670;
  }
  .dates {
    display: flex;
    flex-direction: column;
    gap: 5px;
    padding: 10px 0 2px;
    border-top: 1px solid color-mix(in srgb, var(--border) 80%, transparent);
    margin-top: 2px;
  }
  .date-row {
    display: grid;
    grid-template-columns: 92px 1fr;
    gap: 8px;
    align-items: baseline;
    font-size: 0.8rem;
  }
  .date-row .k {
    color: var(--label);
    font-size: 0.68rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .date-row .v {
    color: #dce4f5;
    font-variant-numeric: tabular-nums;
    font-weight: 500;
  }
  .date-row.emphasis .v {
    color: var(--eta);
    font-weight: 650;
  }
  .date-row.missing .v {
    color: #6a7388;
    font-style: italic;
    font-weight: 450;
  }
  .meta {
    margin-top: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .chip {
    font-size: 0.7rem;
    border-radius: 999px;
    padding: 3px 8px;
    border: 1px solid var(--border);
    color: var(--muted);
    background: color-mix(in srgb, var(--bg) 45%, var(--panel-2));
  }
  .chip.desk { color: #baf5d0; border-color: #2f6b4a; }
  .chip.track {
    font-family: var(--mono);
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .empty {
    color: var(--muted);
    font-size: 0.85rem;
    padding: 22px 8px;
    text-align: center;
  }
  footer.app-footer {
    padding: 0 28px 28px;
    color: var(--muted);
    font-size: 0.78rem;
  }
  /* expected-today */

  .expected {
    margin: 4px 22px 8px;
    padding: 16px 18px 14px;
    background: color-mix(in srgb, var(--panel) 96%, #1a3028);
    border: 1px solid color-mix(in srgb, var(--desk) 35%, var(--border));
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    width: calc(100% - 44px);
    max-width: none;
  }
  .expected-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  .expected-head h2 {
    margin: 0;
    font-size: 0.95rem;
    font-weight: 650;
    letter-spacing: -0.01em;
  }
  .expected-head .when {
    color: var(--muted);
    font-size: 0.8rem;
  }
  .expected-row {
    display: flex;
    flex-wrap: nowrap;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 2px;
  }
  .expected-card {
    flex: 1 1 0;
    min-width: 200px;
    max-width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 13px;
  }
  .expected-card .merchant {
    font-size: 0.95rem;
    margin-bottom: 2px;
  }
  .expected-card .order {
    margin-bottom: 8px;
  }
  .expected-card .why {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--eta);
    margin-bottom: 6px;
    letter-spacing: 0.01em;
  }
  .expected-card .why.at-desk { color: #9ad7b3; }
  .expected-card .why.ofd { color: var(--ofd); }
  .expected-empty {
    color: var(--muted);
    font-size: 0.88rem;
    padding: 4px 0 2px;
  }

  @media (max-width: 1100px) {
    .board { grid-template-columns: repeat(5, 280px); }
  }

  #gate {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .gate-card {
    width: min(380px, 100%); background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 28px; box-shadow: var(--shadow);
  }
  .gate-card h1 { margin: 0 0 8px; font-size: 1.25rem; letter-spacing: -0.02em; }
  .gate-card p { margin: 0 0 18px; color: var(--muted); font-size: 0.92rem; }
  .gate-card input {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 11px 12px; margin-bottom: 12px; outline: none; font: inherit;
  }
  .gate-card input:focus { border-color: var(--accent); }
  .gate-card button {
    width: 100%; border: 0; border-radius: 10px; padding: 11px 12px; font-weight: 650;
    background: var(--accent); color: #0b1220; cursor: pointer; font: inherit;
  }
  .err { color: #ff8f8f; font-size: 0.85rem; min-height: 1.2em; margin-bottom: 8px; }
  #app { display: none; }
</style>
</head>
<body>
  <div id="gate">
    <form class="gate-card" id="gateForm">
      <h1>Shipments</h1>
      <p>Enter the shared password to open the board.</p>
      <div class="err" id="err"></div>
      <input id="pw" type="password" autocomplete="current-password" placeholder="Password" autofocus />
      <button type="submit">Unlock</button>
    </form>
  </div>
  <div id="app">
    <header class="app-header">
      <div class="brand">
        <h1>1425 Hudson shipments</h1>
        <div class="sub" id="subtitle">Unit 11H</div>
      </div>
      <div class="controls">
        <input id="q" type="search" placeholder="Search merchant, item, track…" />
        <select id="sort">
          <option value="date-asc">Date ↑ (soonest first)</option>
          <option value="date-desc">Date ↓ (latest first)</option>
          <option value="merchant">Merchant A–Z</option>
        </select>
        <div class="stat" id="stat"></div>
      </div>
    </header>
    <section class="expected" id="expected" aria-label="Expected today"></section>
  <main class="board" id="board"></main>
    <footer class="app-footer" id="footer"></footer>
  </div>

function parseDate(s) {
  if (!s) return null;
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return new Date(s + "T12:00:00");
  const d = new Date(s);
  return Number.isNaN(d.getTime()) ? null : d;
}
function fmtDate(d) {
  if (!d) return null;

}
function fmtDateFull(d) {
  if (!d) return null;
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}
function primaryDate(ship) {
  const desk = ship.deskMatch || {};
  if (ship.status === "at_desk") return parseDate(desk.arrivedAt) || parseDate(ship.eta) || parseDate(ship.shipDate) || parseDate(ship.orderDate);
  if (ship.status === "picked_up") return parseDate(desk.pickedUpAt) || parseDate(desk.arrivedAt) || parseDate(ship.eta) || parseDate(ship.shipDate) || parseDate(ship.orderDate);
  if (ship.status === "out_for_delivery") return parseDate(ship.eta) || parseDate(ship.shipDate) || parseDate(ship.orderDate);
  if (ship.status === "shipped") return parseDate(ship.eta) || parseDate(ship.shipDate) || parseDate(ship.orderDate);
  return parseDate(ship.orderDate) || parseDate(ship.eta) || parseDate(ship.shipDate);
}
function trackChip(ship) {

function matchesQuery(ship, q) {

  const blob = [

    ...(ship.items || []),
    ...((ship.tracks || []).map(t => t.raw)),
    ship.deskMatch && ship.deskMatch.deskCode,

  return blob.includes(q);
}
function sortShips(list, mode) {
  const copy = [...list];
  if (mode === "merchant") {

    });
  } else if (eta && ship.status === "at_desk") {
    rows.push({ k: "Was ETA", v: fmtDateFull(eta), missing: false, emphasis: false });
  }
  if (ship.status === "at_desk" || arrived) {
    rows.push({
      k: "At desk",
      v: arrived ? fmtDateFull(arrived) : "—",
      missing: !arrived,
      emphasis: ship.status === "at_desk",
    });
  }
  if (ship.status === "picked_up" || picked) {
    rows.push({
      k: "Picked up",
      v: picked ? fmtDateFull(picked) : "—",
      missing: !picked,
      emphasis: ship.status === "picked_up",
    });
  }
  return `<div class="dates">${rows.map(r =>
    `<div class="date-row${r.emphasis ? " emphasis" : ""}${r.missing ? " missing" : ""}"><span class="k">${r.k}</span><span class="v">${escapeHtml(r.v)}</span></div>`
  ).join("")}</div>`;
}
function renderCard(ship) {
  const items = (ship.items || []).map(i => `<li>${escapeHtml(i)}</li>`).join("");
  const track = trackChip(ship);
  const chips = [];
  if (ship.carrier) chips.push(`<span class="chip">${escapeHtml(ship.carrier)}</span>`);
  if (ship.status === "at_desk") chips.push(`<span class="chip desk">Waiting at desk</span>`);
  if (track) chips.push(`<span class="chip track" title="${escapeHtml(track)}">${escapeHtml(track)}</span>`);
  return `
    <article class="card">
      <div class="merchant">${escapeHtml(ship.merchant || "Unknown")}</div>
      <div class="order">${escapeHtml(ship.orderId || ship.id || "")}</div>
      ${items ? `<ul class="items">${items}</ul>` : ""}
      ${dateRowsHtml(ship)}
      ${chips.length ? `<div class="meta">${chips.join("")}</div>` : ""}
    </article>`;
}

function todayKey(d = new Date()) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function dateKeyFromShipField(s) {
  if (!s) return null;
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  const d = parseDate(s);
  if (!d) return null;
  return todayKey(d);
}
function expectedToday(DATA) {
  const today = todayKey();
  const out = [];
  for (const ship of Object.values(DATA.shipments || {})) {
    const desk = ship.deskMatch || {};
    if (ship.status === "picked_up") continue;
    if (ship.status === "at_desk") {
      out.push({ ship, why: "At desk now", kind: "at-desk" });
      continue;
    }
    if (ship.status === "out_for_delivery") {
      const eta = dateKeyFromShipField(ship.eta);
      out.push({ ship, why: eta === today ? "Out for delivery · due today" : "Out for delivery", kind: "ofd" });
      continue;
    }
    const eta = dateKeyFromShipField(ship.eta);
    if (eta === today && (ship.status === "shipped" || ship.status === "ordered")) {
      out.push({ ship, why: ship.status === "ordered" ? "Est. arrival today" : "ETA today", kind: "eta" });
    }
  }
  // at desk first, then OFD, then ETA
  const rank = { "at-desk": 0, ofd: 1, eta: 2 };
  out.sort((a, b) => (rank[a.kind] - rank[b.kind]) || (a.ship.merchant || "").localeCompare(b.ship.merchant || ""));
  return { today, items: out };
}
function renderExpected(DATA) {
  const root = document.getElementById("expected");
  if (!root) return;
  const { today, items } = expectedToday(DATA);
  const when = parseDate(today);
  const whenLabel = when ? when.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" }) : today;
  let body;
  if (!items.length) {
    body = `<div class="expected-empty">Nothing due at the desk or arriving today.</div>`;
  } else {
    body = `<div class="expected-row">${items.map(({ ship, why, kind }) => {
      const itemsHtml = (ship.items || []).slice(0, 2).map(i => `<li>${escapeHtml(i)}</li>`).join("");
      const more = (ship.items || []).length > 2 ? `<li>+${ship.items.length - 2} more</li>` : "";
      return `<article class="expected-card">
        <div class="why ${kind === "at-desk" ? "at-desk" : kind === "ofd" ? "ofd" : ""}">${escapeHtml(why)}</div>
        <div class="merchant">${escapeHtml(ship.merchant || "Unknown")}</div>
        <div class="order">${escapeHtml(ship.orderId || ship.id || "")}</div>
        ${itemsHtml ? `<ul class="items">${itemsHtml}${more}</ul>` : ""}
      </article>`;
    }).join("")}</div>`;
  }
  root.innerHTML = `<div class="expected-head"><h2>Expected today</h2><div class="when">${escapeHtml(whenLabel)} · ${items.length}</div></div>${body}`;
}

function render(DATA) {
  renderExpected(DATA);
  const q = document.getElementById("q").value.trim().toLowerCase();
  const sort = document.getElementById("sort").value;
  const board = document.getElementById("board");
  board.innerHTML = "";
  const ships = Object.values(DATA.shipments || {}).filter(s => matchesQuery(s, q));
  const sub = document.getElementById("subtitle");
  if (sub) sub.textContent = `${DATA.building || "1425 Hudson"} · ${DATA.unit || ""}`.replace(/\s·\s$/, "");
  const stat = document.getElementById("stat");
  if (stat) stat.textContent = `${ships.length} shown`;
  const foot = document.getElementById("footer");
  if (foot) foot.textContent = `Ledger updated ${DATA.updatedAt || "—"} · ${Object.keys(DATA.shipments || {}).length} total shipments${DATA._boardBuiltAt ? " · board built " + DATA._boardBuiltAt : ""}`;
  for (const col of COLS) {
    const colEl = document.createElement("section");
    colEl.className = "col";
    const list = sortShips(ships.filter(s => s.status === col.key), sort);
    colEl.innerHTML = `<div class="col-head"><div class="col-title"><span class="dot" style="background:${col.color}"></span>${col.label}</div><span class="count">${list.length}</span></div>`;
    const cards = document.createElement("div");
    cards.className = "cards";
    if (!list.length) {
      cards.innerHTML = `<div class="empty">Nothing here</div>`;
    } else {
      cards.innerHTML = list.map(renderCard).join("");
    }
    colEl.appendChild(cards);
    board.appendChild(colEl);
  }
}

function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function deriveKey(password, salt, iter) {
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" },
    baseKey,
    { name: "AES-GCM", length: 256 },
    false,
    ["decrypt"]
  );
}
async function unlock(password) {
  const salt = b64ToBytes(PAYLOAD.salt);
  const iv = b64ToBytes(PAYLOAD.iv);
  const ct = b64ToBytes(PAYLOAD.ct);
  const key = await deriveKey(password, salt, PAYLOAD.iter);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
  DATA = JSON.parse(new TextDecoder().decode(plain));
  localStorage.setItem("pkg_board_pw", password);
}
function showApp() {
  document.getElementById("gate").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("q").addEventListener("input", () => render(DATA));
  document.getElementById("sort").addEventListener("change", () => render(DATA));
  render(DATA);
}
document.getElementById("gateForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const err = document.getElementById("err");
  err.textContent = "";
  try {
    await unlock(document.getElementById("pw").value);
    showApp();
  } catch (ex) {
    err.textContent = "Wrong password";
  }
});
(async () => {
  const saved = localStorage.getItem("pkg_board_pw");
  if (!saved) return;
  try { await unlock(saved); showApp(); }
  catch (_) { localStorage.removeItem("pkg_board_pw"); }
})();
</script>
