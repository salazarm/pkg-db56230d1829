<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Shipments</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1e2330; --border: #2a3142;
    --text: #e8ecf4; --muted: #93a0b8; --accent: #7aa2ff; --ordered: #8b95a8;
    --shipped: #5b9fd4; --ofd: #e0a54b; --desk: #5ecf8a; --picked: #6b7280;
    --shadow: 0 10px 30px rgba(0,0,0,.35); --radius: 14px;
    font-family: "SF Pro Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--text); min-height: 100vh;
    background: radial-gradient(1200px 600px at 10% -10%, #1a2744 0%, transparent 55%),
      radial-gradient(900px 500px at 90% 0%, #1a3028 0%, transparent 50%), var(--bg);
  }
  #gate {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .gate-card {
    width: min(380px, 100%); background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 28px; box-shadow: var(--shadow);
  }
  .gate-card h1 { margin: 0 0 8px; font-size: 1.25rem; }
  .gate-card p { margin: 0 0 18px; color: var(--muted); font-size: 0.92rem; }
  .gate-card input {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 11px 12px; margin-bottom: 12px; outline: none;
  }
  .gate-card input:focus { border-color: var(--accent); }
  .gate-card button {
    width: 100%; border: 0; border-radius: 10px; padding: 11px 12px; font-weight: 650;
    background: var(--accent); color: #0b1220; cursor: pointer;
  }
  .err { color: #ff8f8f; font-size: 0.85rem; min-height: 1.2em; margin-bottom: 8px; }
  #app { display: none; }
  header {
    padding: 22px 28px 8px; display: flex; flex-wrap: wrap; gap: 12px 24px;
    align-items: end; justify-content: space-between;
  }
  h1.title { margin: 0; font-size: 1.45rem; font-weight: 650; letter-spacing: -0.02em; }
  .sub { color: var(--muted); font-size: 0.92rem; margin-top: 4px; }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  input[type="search"], select {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 9px 12px; min-width: 180px; outline: none;
  }
  .stat { color: var(--muted); font-size: 0.85rem; }
  .board {
    display: grid; grid-template-columns: repeat(5, minmax(240px, 1fr));
    gap: 14px; padding: 16px 22px 40px; overflow-x: auto; align-items: start;
  }
  .col {
    background: color-mix(in srgb, var(--panel) 92%, transparent);
    border: 1px solid var(--border); border-radius: var(--radius); min-height: 280px;
    box-shadow: var(--shadow);
  }
  .col-head {
    padding: 14px 14px 10px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .col-title { display: flex; gap: 8px; align-items: center; font-weight: 600; font-size: 0.95rem; }
  .dot { width: 9px; height: 9px; border-radius: 50%; }
  .count {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--muted);
    border-radius: 999px; padding: 2px 8px; font-size: 0.78rem;
  }
  .cards { padding: 10px; display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 12px; padding: 12px;
  }
  .merchant { font-weight: 650; font-size: 0.95rem; }
  .order {
    color: var(--muted); font-size: 0.78rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; margin-bottom: 8px;
  }
  .items { margin: 0; padding-left: 16px; color: #d5dceb; font-size: 0.84rem; line-height: 1.35; }
  .meta { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 0.72rem; border-radius: 999px; padding: 3px 8px; border: 1px solid var(--border);
    color: var(--muted); background: color-mix(in srgb, var(--bg) 40%, var(--panel-2));
  }
  .chip.date { color: #d7e3ff; border-color: #3a4b73; }
  .chip.track {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .chip.desk { color: #baf5d0; border-color: #2f6b4a; }
  .empty { color: var(--muted); font-size: 0.85rem; padding: 18px 8px; text-align: center; }
  footer { padding: 0 28px 28px; color: var(--muted); font-size: 0.8rem; }
  @media (max-width: 1100px) { .board { grid-template-columns: repeat(5, 260px); } }
</style>
</head>
<body>
  <div id="gate">
    <form class="gate-card" id="gateForm">
      <h1>Shipments</h1>
      <p>Enter the shared password to open the board.</p>
      <div class="err" id="err"></div>
      <input id="pw" type="password" autocomplete="current-password" placeholder="Password" autofocus />
      <button type="submit">Unlock</button>
    </form>
  </div>
  <div id="app">
    <header>
      <div>
        <h1 class="title">1425 Hudson shipments</h1>
        <div class="sub" id="subtitle">Unit 11H</div>
      </div>
      <div class="controls">
        <input id="q" type="search" placeholder="Search merchant, item, track…" />
        <select id="sort">
          <option value="date-asc">Date ↑ (soonest first)</option>
          <option value="date-desc">Date ↓ (latest first)</option>
          <option value="merchant">Merchant A–Z</option>
        </select>
        <div class="stat" id="stat"></div>
      </div>
    </header>
    <main class="board" id="board"></main>
    <footer id="footer"></footer>
  </div>

  { key: "ordered", label: "Ordered", color: "var(--ordered)" },
  { key: "shipped", label: "Shipped", color: "var(--shipped)" },
  { key: "out_for_delivery", label: "Out for delivery", color: "var(--ofd)" },
  { key: "at_desk", label: "At desk", color: "var(--desk)" },
  { key: "picked_up", label: "Picked up", color: "var(--picked)" },
];

let DATA = null;

function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function deriveKey(password, salt, iter) {
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" },
    baseKey,
    { name: "AES-GCM", length: 256 },
    false,
    ["decrypt"]
  );
}

async function unlock(password) {
  const salt = b64ToBytes(PAYLOAD.salt);
  const iv = b64ToBytes(PAYLOAD.iv);
  const ct = b64ToBytes(PAYLOAD.ct);
  const key = await deriveKey(password, salt, PAYLOAD.iter);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
  DATA = JSON.parse(new TextDecoder().decode(plain));
  sessionStorage.setItem("pkg_board_pw", password);
}

function parseDate(s) {
  if (!s) return null;
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return new Date(s + "T12:00:00");
  const d = new Date(s);
  return Number.isNaN(d.getTime()) ? null : d;
}
function primaryDate(ship) {
  const desk = ship.deskMatch || {};
  if (ship.status === "at_desk") return parseDate(desk.arrivedAt) || parseDate(ship.eta) || parseDate(ship.shipDate);
  if (ship.status === "picked_up") return parseDate(desk.pickedUpAt) || parseDate(desk.arrivedAt) || parseDate(ship.eta) || parseDate(ship.shipDate);
  if (ship.status === "out_for_delivery") return parseDate(ship.eta) || parseDate(ship.shipDate);
  if (ship.status === "shipped") return parseDate(ship.eta) || parseDate(ship.shipDate);
  return parseDate(ship.shipDate) || parseDate(ship.eta);
}
function fmtDate(d) {
  if (!d) return null;
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}
function dateLabel(ship) {
  const d = primaryDate(ship);
  const f = fmtDate(d);
  if (!f) return null;
  if (ship.status === "at_desk") return "Arrived " + f;
  if (ship.status === "picked_up") return "Picked up " + f;
  if (ship.status === "out_for_delivery") return "ETA " + f;
  if (ship.status === "shipped" && ship.eta) return "ETA " + f;
  if (ship.shipDate) return "Shipped " + fmtDate(parseDate(ship.shipDate));
  return f;
}
function trackChip(ship) {
  return (ship.tracks && ship.tracks[0] && ship.tracks[0].raw) || (ship.deskMatch && ship.deskMatch.deskCode) || null;
}
function matchesQuery(ship, q) {
  if (!q) return true;
  const blob = [ship.merchant, ship.orderId, ship.carrier, ship.status, ...(ship.items || []), ...((ship.tracks || []).map(t => t.raw)), ship.deskMatch && ship.deskMatch.deskCode].filter(Boolean).join(" ").toLowerCase();
  return blob.includes(q);
}
function sortShips(list, mode) {
  const copy = [...list];
  if (mode === "merchant") {
    copy.sort((a, b) => (a.merchant || "").localeCompare(b.merchant || "") || (a.orderId || "").localeCompare(b.orderId || ""));
    return copy;
  }
  const desc = mode === "date-desc";
  copy.sort((a, b) => {
    const da = primaryDate(a), db = primaryDate(b);
    if (!da && !db) return (a.merchant || "").localeCompare(b.merchant || "");
    if (!da) return 1; if (!db) return -1;
    return desc ? (db - da) : (da - db);
  });
  return copy;
}
function escapeHtml(s) {
  return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
}
function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const sort = document.getElementById("sort").value;
  const board = document.getElementById("board");
  board.innerHTML = "";
  const ships = Object.values(DATA.shipments || {}).filter(s => matchesQuery(s, q));
  document.getElementById("subtitle").textContent = `${DATA.building || ""} · ${DATA.unit || ""}`.replace(/\s·\s$/, "");
  document.getElementById("stat").textContent = `${ships.length} shown`;
  document.getElementById("footer").textContent = `Ledger updated ${DATA.updatedAt || "—"} · ${Object.keys(DATA.shipments || {}).length} total`;
  for (const col of COLS) {
    const colEl = document.createElement("section");
    colEl.className = "col";
    const list = sortShips(ships.filter(s => s.status === col.key), sort);
    const head = document.createElement("div");
    head.className = "col-head";
    head.innerHTML = `<div class="col-title"><span class="dot" style="background:${col.color}"></span>${col.label}</div><span class="count">${list.length}</span>`;
    colEl.appendChild(head);
    const cards = document.createElement("div");
    cards.className = "cards";
    if (!list.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Nothing here";
      cards.appendChild(empty);
    } else {
      for (const ship of list) {
        const card = document.createElement("article");
        card.className = "card";
        const items = (ship.items || []).map(i => `<li>${escapeHtml(i)}</li>`).join("");
        const date = dateLabel(ship);
        const track = trackChip(ship);
        const chips = [];
        if (date) chips.push(`<span class="chip date">${escapeHtml(date)}</span>`);
        if (ship.carrier) chips.push(`<span class="chip">${escapeHtml(ship.carrier)}</span>`);
        if (ship.status === "at_desk") chips.push(`<span class="chip desk">Waiting at desk</span>`);
        if (track) chips.push(`<span class="chip track" title="${escapeHtml(track)}">${escapeHtml(track)}</span>`);
        card.innerHTML = `<div class="merchant">${escapeHtml(ship.merchant || "Unknown")}</div><div class="order">${escapeHtml(ship.orderId || ship.id || "")}</div>${items ? `<ul class="items">${items}</ul>` : ""}<div class="meta">${chips.join("")}</div>`;
        cards.appendChild(card);
      }
    }
    colEl.appendChild(cards);
    board.appendChild(colEl);
  }
}

function showApp() {
  document.getElementById("gate").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("q").addEventListener("input", render);
  document.getElementById("sort").addEventListener("change", render);
  render();
}

document.getElementById("gateForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const err = document.getElementById("err");
  err.textContent = "";
  const pw = document.getElementById("pw").value;
  try {
    await unlock(pw);
    showApp();
  } catch (ex) {
    err.textContent = "Wrong password";
  }
});

(async () => {
  const saved = sessionStorage.getItem("pkg_board_pw");
  if (!saved) return;
  try {
    await unlock(saved);
    showApp();
  } catch (_) {
    sessionStorage.removeItem("pkg_board_pw");
  }
})();
</script>
</body>
</html>
