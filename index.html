<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<title>Shipments</title>
<style>
:root {
  --bg: #0b0d11;
  --panel: #131820;
  --panel-2: #1a2030;
  --border: #2a3348;
  --text: #eef2fa;
  --muted: #8b97b0;
  --label: #6d7a94;
  --accent: #7aa2ff;
  --ordered: #9aa3b5;
  --shipped: #5b9fd4;
  --ofd: #e0a54b;
  --desk: #5ecf8a;
  --picked: #6b7280;
  --eta: #f0c674;
  --clarry: #c4a0ff;
  --shadow: 0 10px 28px rgba(0,0,0,.35);
  --radius: 12px;
  --pad: clamp(10px, 2.5vw, 18px);
  --font: "SF Pro Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  font-size: 13.5px;
  line-height: 1.35;
  color: var(--text);
  min-height: 100vh;
  background:
    radial-gradient(900px 420px at 10% -10%, #1a2744 0%, transparent 55%),
    radial-gradient(700px 380px at 90% 0%, #163028 0%, transparent 50%),
    var(--bg);
  -webkit-font-smoothing: antialiased;
}
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  backdrop-filter: blur(14px);
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  border-bottom: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
  padding: 8px var(--pad);
  display: flex;
  flex-wrap: wrap;
  gap: 6px 12px;
  align-items: center;
  justify-content: space-between;
}
.brand h1 {
  margin: 0;
  font-size: clamp(1.05rem, 2.8vw, 1.35rem);
  font-weight: 650;
  letter-spacing: -0.03em;
}
.brand .sub {
  margin-top: 2px;
  color: var(--muted);
  font-size: 0.8rem;
}
.totals-chip {
  display: inline-flex;
  gap: 8px;
  align-items: center;
  font-size: 0.72rem;
  color: var(--muted);
  margin-top: 4px;
}
.totals-chip strong {
  color: var(--text);
  font-weight: 650;
  font-variant-numeric: tabular-nums;
}
.controls {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  flex: 1 1 220px;
  justify-content: flex-end;
}
input[type="search"], select {
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 10px;
  padding: 7px 10px;
  min-height: 36px;
  font: inherit;
  outline: none;
  width: min(100%, 220px);
}
input[type="search"] { flex: 1 1 160px; width: auto; min-width: 140px; }
input[type="search"]:focus, select:focus { border-color: var(--accent); }
.stack {
  padding: 8px var(--pad) 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.panel {
  background: color-mix(in srgb, var(--panel) 94%, transparent);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: var(--shadow);
  padding: 10px 12px 8px;
}
.panel-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 6px;
}
.panel-head h2 {
  margin: 0;
  font-size: 0.82rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
}
.panel-head .meta {
  color: var(--label);
  font-size: 0.72rem;
  font-variant-numeric: tabular-nums;
}
.expected-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
  gap: 10px;
}
.expected-card {
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 8px 10px;
}
.expected-card .why {
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  color: var(--eta);
  margin-bottom: 6px;
}
.expected-card .why.at-desk { color: #9ad7b3; }
.expected-card .why.ofd { color: var(--ofd); }
.expected-card .merchant {
  font-weight: 650;
  font-size: 0.92rem;
  letter-spacing: -0.02em;
  margin: 0 0 2px;
}
.expected-card .order {
  color: var(--label);
  font-size: 0.7rem;
  font-family: var(--mono);
  margin-bottom: 4px;
}
.expected-empty, .counts-empty {
  color: var(--muted);
  font-size: 0.88rem;
  padding: 2px 0;
}
.counts-wrap {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.counts-group-label {
  font-size: 0.72rem;
  font-weight: 650;
  color: var(--text);
  margin: 0 0 6px 1px;
}
.counts-group.clarry .counts-group-label { color: var(--clarry); }
.counts {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.count-pill {
  display: inline-flex;
  align-items: baseline;
  gap: 7px;
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 7px 12px;
}
.counts-group.clarry .count-pill {
  border-color: color-mix(in srgb, var(--clarry) 40%, var(--border));
}
.count-pill .n {
  font-size: 1.1rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.03em;
  line-height: 1;
}
.count-pill .l {
  font-size: 0.68rem;
  font-weight: 650;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--label);
}
.board-wrap { margin: 0 calc(var(--pad) * -1); padding: 0 var(--pad); }
.board-label {
  padding: 0 var(--pad);
  margin: 0 0 8px;
  font-size: 0.82rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
}
.board {
  display: grid;
  grid-template-columns: repeat(5, minmax(210px, 1fr));
  gap: 8px;
  padding: 0 var(--pad) 8px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scroll-snap-type: x proximity;
  align-items: start;
}
.col {
  background: color-mix(in srgb, var(--panel) 94%, transparent);
  border: 1px solid var(--border);
  border-radius: 12px;
  min-height: 80px;
  box-shadow: var(--shadow);
  scroll-snap-align: start;
}
.col.collapsed .cards { display: none; }
.col-head {
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.col-title {
  display: flex;
  gap: 8px;
  align-items: center;
  font-weight: 600;
  font-size: 0.86rem;
}
.dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.count {
  background: var(--panel-2);
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 999px;
  padding: 2px 8px;
  font-size: 0.74rem;
  font-variant-numeric: tabular-nums;
}
.cards { padding: 6px; display: flex; flex-direction: column; gap: 6px; }
.card {
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 8px 10px;
}
.merchant {
  font-weight: 650;
  font-size: 0.9rem;
  letter-spacing: -0.02em;
  margin: 0 0 2px;
}
.order {
  color: var(--label);
  font-size: 0.7rem;
  font-family: var(--mono);
  margin-bottom: 4px;
}
.items {
  margin: 0 0 10px;
  padding: 0;
  list-style: none;
  color: #d7deed;
  font-size: 0.72rem;
  line-height: 1.4;
}
.items li {
  position: relative;
  padding-left: 12px;
  margin-bottom: 4px;
}
.items li::before {
  content: "";
  position: absolute;
  left: 0; top: 0.55em;
  width: 4px; height: 4px;
  border-radius: 50%;
  background: #4a5670;
}
.item-owner {
  display: inline-block;
  margin-left: 6px;
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--clarry);
  border: 1px solid color-mix(in srgb, var(--clarry) 45%, var(--border));
  border-radius: 999px;
  padding: 1px 6px;
  vertical-align: middle;
}
.dates {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding-top: 5px;
  border-top: 1px solid color-mix(in srgb, var(--border) 80%, transparent);
}
.date-row {
  display: grid;
  grid-template-columns: 72px 1fr;
  gap: 8px;
  align-items: baseline;
  font-size: 0.72rem;
}
.date-row .k {
  color: var(--label);
  font-size: 0.65rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.date-row .v {
  color: #dce4f5;
  font-variant-numeric: tabular-nums;
  font-weight: 500;
}
.date-row.emphasis .v { color: var(--eta); font-weight: 650; }
.date-row.missing .v { color: #6a7388; font-style: italic; font-weight: 450; }
.meta {
  margin-top: 8px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.chip {
  font-size: 0.68rem;
  border-radius: 999px;
  padding: 3px 8px;
  border: 1px solid var(--border);
  color: var(--muted);
  background: color-mix(in srgb, var(--bg) 45%, var(--panel-2));
}
.chip.desk { color: #baf5d0; border-color: #2f6b4a; }
.chip.track {
  font-family: var(--mono);
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.empty {
  color: var(--muted);
  font-size: 0.72rem;
  padding: 14px 6px;
  text-align: center;
}
.toggle-picked {
  margin: 2px var(--pad) 12px;
  background: transparent;
  border: 1px dashed var(--border);
  color: var(--muted);
  border-radius: 10px;
  padding: 7px 10px;
  font: inherit;
  cursor: pointer;
  width: calc(100% - 2 * var(--pad));
  min-height: 38px;
}
.toggle-picked:hover { color: var(--text); border-color: var(--accent); }
footer.app-footer {
  padding: 0 var(--pad) 14px;
  color: var(--muted);
  font-size: 0.75rem;
}
#gate {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.gate-card {
  width: min(380px, 100%);
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 22px;
  box-shadow: var(--shadow);
}
.gate-card h1 { margin: 0 0 8px; font-size: 1.25rem; letter-spacing: -0.02em; }
.gate-card p { margin: 0 0 18px; color: var(--muted); font-size: 0.92rem; }
.gate-card input {
  width: 100%;
  background: var(--panel-2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 10px;
  padding: 8px 10px;
  margin-bottom: 12px;
  outline: none;
  font: inherit;
  min-height: 38px;
}
.gate-card input:focus { border-color: var(--accent); }
.gate-card button {
  width: 100%;
  border: 0;
  border-radius: 10px;
  padding: 8px 10px;
  font-weight: 650;
  background: var(--accent);
  color: #0b1220;
  cursor: pointer;
  font: inherit;
  min-height: 38px;
}
.err { color: #ff8f8f; font-size: 0.85rem; min-height: 1.2em; margin-bottom: 4px; }
#app { display: none; }

.drow {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 6px;
  padding-top: 6px;
  border-top: 1px solid color-mix(in srgb, var(--border) 80%, transparent);
}
.dchip {
  font-size: 0.68rem;
  font-variant-numeric: tabular-nums;
  color: #dce4f5;
  background: color-mix(in srgb, var(--bg) 50%, var(--panel-2));
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 2px 6px;
  line-height: 1.3;
}
.dchip em {
  font-style: normal;
  font-weight: 700;
  color: var(--label);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-size: 0.6rem;
  margin-right: 3px;
}
.dchip.emphasis { border-color: color-mix(in srgb, var(--eta) 45%, var(--border)); }
.dchip.emphasis em, .dchip.emphasis { color: var(--eta); }
.dchip.deskish { border-color: color-mix(in srgb, var(--desk) 40%, var(--border)); }
.dchip.deskish em { color: #9ad7b3; }
.dchip.miss { color: #6a7388; }
.stack { gap: 8px !important; }
.panel-head { margin-bottom: 6px !important; }
.expected-row { gap: 8px !important; }
.cards { gap: 6px !important; padding: 6px !important; }
.card { padding: 8px 10px !important; }
.items { margin: 0 0 4px !important; }
.items li { margin-bottom: 2px !important; }
.meta { margin-top: 6px !important; gap: 4px !important; }
.board { gap: 8px !important; }
.col-head { padding: 8px 10px !important; }
.topbar { padding: 8px var(--pad) !important; }
.brand h1 { font-size: clamp(0.98rem, 2.5vw, 1.2rem) !important; }
.totals-chip { margin-top: 2px !important; font-size: 0.72rem !important; }

@media (max-width: 720px) {
  .board {
    grid-template-columns: repeat(5, min(88vw, 320px));
    padding-bottom: 12px;
    scroll-snap-type: x mandatory;
  }
  .col { scroll-snap-align: center; }
  .date-row { grid-template-columns: 78px 1fr; }
  .controls { justify-content: stretch; }
  select { width: 100%; }
}
</style>
</head>
<body>
  <div id="gate">
    <form class="gate-card" id="gateForm">
      <h1>Shipments</h1>
      <p>Enter the shared password to open the board.</p>
      <div class="err" id="err"></div>
      <input id="pw" type="password" autocomplete="current-password" placeholder="Password" autofocus />
      <button type="submit">Unlock</button>
    </form>
  </div>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <h1>1425 Hudson shipments</h1>
        <div class="sub" id="subtitle">Unit 11H</div>
        <div class="totals-chip" id="totals"></div>
      </div>
      <div class="controls">
        <input id="q" type="search" placeholder="Search…" enterkeyhint="search" />
        <select id="sort">
          <option value="date-asc">Soonest first</option>
          <option value="date-desc">Latest first</option>
          <option value="merchant">Merchant A–Z</option>
        </select>
      </div>
    </header>
    <div class="stack">
      <section class="panel" id="expected" aria-label="Expected today"></section>
      <section class="panel" id="counts" aria-label="Open item counts"></section>
    </div>
    <div class="board-label">By status</div>
    <div class="board-wrap"><main class="board" id="board"></main></div>
    <button type="button" class="toggle-picked" id="togglePicked">Show picked up</button>
    <footer class="app-footer" id="footer"></footer>
  </div>

function matchesQuery(ship, q) {
  if (!q) return true;
  const blob = [ship.merchant, ship.orderId, ship.carrier, ship.status, ...(ship.items||[]), ...((ship.tracks||[]).map(t=>t.raw)), ship.deskMatch && ship.deskMatch.deskCode].filter(Boolean).join(" ").toLowerCase();
  return blob.includes(q);
}
function sortShips(list, mode) {
  const copy = [...list];
  if (mode === "merchant") {
    copy.sort((a,b) => (a.merchant||"").localeCompare(b.merchant||"") || (a.orderId||"").localeCompare(b.orderId||""));
    return copy;
  }
  const desc = mode === "date-desc";
  copy.sort((a,b) => {
    const da = primaryDate(a), db = primaryDate(b);
    if (!da && !db) return (a.merchant||"").localeCompare(b.merchant||"");
    if (!da) return 1; if (!db) return -1;
    return desc ? (db-da) : (da-db);
  });
  return copy;
}
function escapeHtml(s) {
  return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
}
function expandItemQty(raw) {
  const s = String(raw || "").trim();
  if (!s) return [];
  let m = s.match(/^\s*(\d+)\s+(.+)$/i);
  if (m && /^(apparel|electronics|pet)\b/i.test(m[2])) return Array(Math.min(50, parseInt(m[1],10))).fill(m[2]);
  m = s.match(/^(.*?)\s*\(x(\d+)\)\s*$/i);
  if (m) return Array(Math.min(50, parseInt(m[2],10))).fill(m[1].trim());
  return [s];
}
function categorizeItem(name) {
  const t = name.toLowerCase();
  if (/\bpet\b/.test(t)) return "pet";
  if (/\belectronics?\b/.test(t)) return "other";
  if (/\b(boxer|brief|underwear|trunks)\b/.test(t)) return "underwear";
  if (/\b(shoe|sneaker|boot|air force)\b/.test(t)) return "shoes";
  if (/\b(short|shorts)\b/.test(t) && !/\bshirt\b/.test(t)) return "shorts";
  if (/\b(jogger|joggers|pant|pants|trouser|chino)\b/.test(t)) return "pants";
  if (/\b(sweater|sweatshirt|hoodie|fleece|thermal|2fer)\b/.test(t)) return "sweaters";
  if (/\b(t-?shirt|\btee\b|graphic tee)\b/.test(t)) return "tees";
  if (/\b(overshirt|shirt|oxford|chambray|button)\b/.test(t)) return "shirts";
  if (/\bapparel\b/.test(t)) return "other";
  if (/xx-?large|2xl|xxl/.test(t) && !/\b(pant|short|shoe)\b/.test(t)) return "tees";
  return "other";
}
function ownerOfItem(name, ship) {
  if (ship && ship.owner === "clarry") return "clarry";
  if (ship && ship.owner === "marco") return "marco";
  const t = String(name || "").toLowerCase();
  if (/\b(girl'?s?|women'?s?|woman|ladies|lady|junior|female)\b/.test(t)) return "clarry";
  if (/(?:^|[^a-z0-9])(?:xxs|xs|x-small|extra[\s-]?small)(?:[^a-z0-9]|$)/i.test(t)) return "clarry";
  if (/[\/\-]\s*s\s*$/i.test(t)) return "clarry";
  if (/\bsize\s*s\b/i.test(t) && !/\b(xxl|2xl|xl)\b/i.test(t)) return "clarry";
  if (/(?:^|[\/\s\-])(?:size\s*)?(?:small)(?:\s*[\/\-]|$)/i.test(t)) return "clarry";
  if (/\bsize\s*(0|[2-8]|10)\b/i.test(t)) return "clarry";
  return "marco";
}
function itemLinesHtml(ship) {
  return (ship.items || []).map(i => {
    const owner = ownerOfItem(i, ship);
    const badge = owner === "clarry" ? `<span class="item-owner">Clarry</span>` : "";
    return `<li>${escapeHtml(i)}${badge}</li>`;
  }).join("");
}
function dateRowsHtml(ship) {
  const desk = ship.deskMatch || {};
  const bits = [];
  const ordered = parseDate(ship.orderDate);
  const shipped = parseDate(ship.shipDate);
  const eta = parseDate(ship.eta);
  const arrived = parseDate(desk.arrivedAt);
  const picked = parseDate(desk.pickedUpAt);
  const short = (d) => d ? d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) : null;
  if (ordered) bits.push(`<span class="dchip"><em>Ord</em> ${escapeHtml(short(ordered))}</span>`);
  if (ship.status !== "ordered") {
    bits.push(shipped
      ? `<span class="dchip"><em>Ship</em> ${escapeHtml(short(shipped))}</span>`
      : `<span class="dchip miss"><em>Ship</em> —</span>`);
  }
  if (ship.status === "ordered") {
    bits.push(eta
      ? `<span class="dchip emphasis"><em>Est</em> ${escapeHtml(short(eta))}</span>`
      : `<span class="dchip miss"><em>Est</em> —</span>`);
  } else if (["shipped", "out_for_delivery"].includes(ship.status)) {
    bits.push(eta
      ? `<span class="dchip emphasis"><em>ETA</em> ${escapeHtml(short(eta))}</span>`
      : `<span class="dchip miss"><em>ETA</em> —</span>`);
  }
  if (ship.status === "at_desk" || arrived) {
    bits.push(arrived
      ? `<span class="dchip deskish"><em>Desk</em> ${escapeHtml(short(arrived))}</span>`
      : `<span class="dchip miss"><em>Desk</em> —</span>`);
  }
  if (ship.status === "picked_up" || picked) {
    bits.push(picked
      ? `<span class="dchip"><em>Up</em> ${escapeHtml(short(picked))}</span>`
      : `<span class="dchip miss"><em>Up</em> —</span>`);
  }
  return bits.length ? `<div class="drow">${bits.join("")}</div>` : "";
}
function renderCard(ship) {
  const items = itemLinesHtml(ship);
  const track = trackChip(ship);
  const chips = [];
  if (ship.carrier) chips.push(`<span class="chip">${escapeHtml(ship.carrier)}</span>`);
  if (ship.status === "at_desk") chips.push(`<span class="chip desk">Waiting at desk</span>`);
  if (track) chips.push(`<span class="chip track" title="${escapeHtml(track)}">${escapeHtml(track)}</span>`);
  return `<article class="card"><div class="merchant">${escapeHtml(ship.merchant||"Unknown")}</div><div class="order">${escapeHtml(ship.orderId||ship.id||"")}</div>${items?`<ul class="items">${items}</ul>`:""}${dateRowsHtml(ship)}${chips.length?`<div class="meta">${chips.join("")}</div>`:""}</article>`;
}
function expectedToday(DATA, ships) {
  const today = todayKey();
  const out = [];
  for (const ship of ships) {
    if (ship.status === "picked_up") continue;
    if (ship.status === "at_desk") { out.push({ ship, why: "At desk now", kind: "at-desk" }); continue; }
    if (ship.status === "out_for_delivery") {
      const eta = dateKeyFromShipField(ship.eta);
      out.push({ ship, why: eta === today ? "Out for delivery · due today" : "Out for delivery", kind: "ofd" });
      continue;
    }
    const eta = dateKeyFromShipField(ship.eta);
    if (eta === today && (ship.status === "shipped" || ship.status === "ordered")) {
      out.push({ ship, why: ship.status === "ordered" ? "Est. arrival today" : "ETA today", kind: "eta" });
    }
  }
  const rank = { "at-desk": 0, ofd: 1, eta: 2 };
  out.sort((a,b) => (rank[a.kind]-rank[b.kind]) || (a.ship.merchant||"").localeCompare(b.ship.merchant||""));
  return { today, items: out };
}
function renderExpected(DATA, ships) {
  const root = document.getElementById("expected");
  if (!root) return;
  const { today, items } = expectedToday(DATA, ships);
  const when = parseDate(today);
  const whenLabel = when ? when.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" }) : today;
  let body;
  if (!items.length) body = `<div class="expected-empty">Nothing at the desk or due today.</div>`;
  else body = `<div class="expected-row">${items.map(({ship,why,kind}) => {
    const itemsHtml = itemLinesHtml(ship);
    return `<article class="expected-card"><div class="why ${kind==="at-desk"?"at-desk":kind==="ofd"?"ofd":""}">${escapeHtml(why)}</div><div class="merchant">${escapeHtml(ship.merchant||"Unknown")}</div><div class="order">${escapeHtml(ship.orderId||ship.id||"")}</div>${itemsHtml?`<ul class="items">${itemsHtml}</ul>`:""}</article>`;
  }).join("")}</div>`;
  root.innerHTML = `<div class="panel-head"><h2>Expected today</h2><div class="meta">${escapeHtml(whenLabel)} · ${items.length}</div></div>${body}`;
}
function itemCountsByOwner(ships) {
  const empty = () => Object.fromEntries(CATEGORY_ORDER.map(([k]) => [k, 0]));
  const out = { marco: empty(), clarry: empty() };
  for (const ship of ships) {
    if (ship.status === "picked_up") continue; // open only
    for (const raw of ship.items || []) {
      for (const piece of expandItemQty(raw)) {
        const owner = ownerOfItem(piece, ship);
        const cat = categorizeItem(piece);
        out[owner][cat] += 1;
      }
    }
  }
  return out;
}
function countPieces(ships, { openOnly } = { openOnly: false }) {
  let n = 0;
  for (const ship of ships) {
    if (openOnly && ship.status === "picked_up") continue;
    for (const raw of ship.items || []) n += expandItemQty(raw).length;
  }
  return n;
}
function renderCounts(DATA, ships) {
  const root = document.getElementById("counts");
  if (!root) return;
  const by = itemCountsByOwner(ships);
  const groups = [
    { key: "marco", label: "Marco" },
    { key: "clarry", label: "Clarry" },
  ];
  const blocks = [];
  for (const g of groups) {
    const pills = CATEGORY_ORDER
      .map(([key, label]) => ({ key, label, n: by[g.key][key] || 0 }))
      .filter(x => x.n > 0);
    if (!pills.length) continue;
    const total = pills.reduce((a, b) => a + b.n, 0);
    blocks.push(`<div class="counts-group ${g.key}"><div class="counts-group-label">${g.label} · ${total} open</div><div class="counts">${pills.map(p => `<div class="count-pill"><span class="n">${p.n}</span><span class="l">${p.label}</span></div>`).join("")}</div></div>`);
  }
  root.innerHTML = blocks.length
    ? `<div class="panel-head"><h2>Still out</h2><div class="meta">Not picked up yet</div></div><div class="counts-wrap">${blocks.join("")}</div>`
    : `<div class="panel-head"><h2>Still out</h2></div><div class="counts-empty">Nothing open in these categories.</div>`;
}
function renderTotals(ships) {
  const el = document.getElementById("totals");
  if (!el) return;
  const openShipments = ships.filter(s => s.status !== "picked_up").length;
  const openItems = countPieces(ships, { openOnly: true });
  const allItems = countPieces(ships, { openOnly: false });
  el.innerHTML = `<strong>${openItems}</strong> open items · <strong>${openShipments}</strong> open packages · <strong>${allItems}</strong> all-time items`;
}

let showPickedUp = false;

function render(DATA) {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const sort = document.getElementById("sort").value;
  const board = document.getElementById("board");
  board.innerHTML = "";
  const ships = Object.values(DATA.shipments || {}).filter(s => matchesQuery(s, q));
  const sub = document.getElementById("subtitle");
  if (sub) sub.textContent = `${DATA.building || "1425 Hudson"} · ${DATA.unit || ""}`.replace(/\s·\s$/, "");
  renderTotals(ships);
  renderExpected(DATA, ships);
  renderCounts(DATA, ships);
  const foot = document.getElementById("footer");
  if (foot) foot.textContent = `Ledger updated ${DATA.updatedAt || "—"} · ${Object.keys(DATA.shipments||{}).length} shipments${DATA._boardBuiltAt ? " · board " + DATA._boardBuiltAt : ""}`;

  for (const col of COLS) {
    if (col.key === "picked_up" && !showPickedUp) continue;
    const list = sortShips(ships.filter(s => s.status === col.key), sort);
    const colEl = document.createElement("section");
    colEl.className = "col";
    colEl.innerHTML = `<div class="col-head"><div class="col-title"><span class="dot" style="background:${col.color}"></span>${col.label}</div><span class="count">${list.length}</span></div>`;
    const cards = document.createElement("div");
    cards.className = "cards";
    cards.innerHTML = list.length ? list.map(renderCard).join("") : `<div class="empty">Nothing here</div>`;
    colEl.appendChild(cards);
    board.appendChild(colEl);
  }
  const tog = document.getElementById("togglePicked");
  if (tog) {
    const n = ships.filter(s => s.status === "picked_up").length;
    tog.textContent = showPickedUp ? `Hide picked up (${n})` : `Show picked up (${n})`;
  }
}

function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function deriveKey(password, salt, iter) {
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" },
    baseKey,
    { name: "AES-GCM", length: 256 },
    false,
    ["decrypt"]
  );
}
async function unlock(password) {
  const salt = b64ToBytes(PAYLOAD.salt);
  const iv = b64ToBytes(PAYLOAD.iv);
  const ct = b64ToBytes(PAYLOAD.ct);
  const key = await deriveKey(password, salt, PAYLOAD.iter);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
  DATA = JSON.parse(new TextDecoder().decode(plain));
  localStorage.setItem("pkg_board_pw", password);
}
function showApp() {
  document.getElementById("gate").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("q").addEventListener("input", () => render(DATA));
  document.getElementById("sort").addEventListener("change", () => render(DATA));
  document.getElementById("togglePicked").addEventListener("click", () => { showPickedUp = !showPickedUp; render(DATA); });
  render(DATA);
}
document.getElementById("gateForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const err = document.getElementById("err");
  err.textContent = "";
  try { await unlock(document.getElementById("pw").value); showApp(); }
  catch (ex) { err.textContent = "Wrong password"; }
});
(async () => {
  const saved = localStorage.getItem("pkg_board_pw");
  if (!saved) return;
  try { await unlock(saved); showApp(); }
  catch (_) { localStorage.removeItem("pkg_board_pw"); }
})();
</script>
